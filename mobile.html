<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>KB Command Center</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --gold:#B8860B;--gold-bg:#FFFBEA;--gold-bd:#E5CC6A;
  --ink1:#1A1208;--ink2:#3D2E0A;--ink3:#6B5B45;--ink4:#9C8E7A;
  --bg:#FAF7F2;--card:#FFFFFF;--border:#E8E0D0;--border2:#D4C9B0;
  --red:#C0392B;--red-bg:#FEF2F2;--red-bd:#FECACA;
  --green:#166534;--green-bg:#F0FDF4;--green-bd:#BBF7D0;
  --blue:#1D4ED8;--blue-bg:#EFF6FF;--blue-bd:#BFDBFE;
  --f:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --radius:12px;--shadow:0 2px 12px rgba(0,0,0,.08);
}
body{background:var(--bg);font-family:var(--f);color:var(--ink1);min-height:100vh;padding-bottom:80px;}

/* NAV BAR */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0 8px;font-size:10px;font-weight:600;color:var(--ink4);letter-spacing:.04em;gap:3px;border:none;background:none;cursor:pointer;}
.nav-btn.active{color:var(--gold);}
.nav-btn svg{width:22px;height:22px;}

/* HEADER */
.header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 16px 12px;position:sticky;top:0;z-index:50;}
.header-row{display:flex;align-items:center;justify-content:space-between;}
.header h1{font-size:17px;font-weight:700;color:var(--ink1);}
.header-sub{font-size:11px;color:var(--ink4);margin-top:2px;}

/* VIEWS */
.view{display:none;padding:12px 16px;}
.view.active{display:block;}

/* CARDS */
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:12px;overflow:hidden;}
.card-hdr{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.card-hdr-title{font-size:14px;font-weight:700;color:var(--ink1);}
.card-body{padding:12px 14px;}

/* TODOS */
.list-block{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:12px;overflow:hidden;}
.list-hdr{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.list-avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.list-name{font-size:14px;font-weight:700;color:var(--ink1);flex:1;}
.list-meta{font-size:11px;color:var(--ink4);}
.list-chevron{font-size:16px;color:var(--ink4);transition:transform .2s;}
.list-chevron.open{transform:rotate(90deg);}
.list-tasks{display:none;border-top:1px solid var(--border);}
.list-tasks.open{display:block;}

.task-row{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);}
.task-row:last-child{border-bottom:none;}
.task-chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.task-chk.done{background:var(--green);border-color:var(--green);}
.task-chk.done::after{content:'✓';color:#fff;font-size:11px;font-weight:700;}
.task-body{flex:1;min-width:0;}
.task-text{font-size:14px;color:var(--ink1);line-height:1.4;}
.task-text.x{text-decoration:line-through;color:var(--ink4);}
.task-due{font-size:11px;margin-top:2px;}
.task-due.ov{color:var(--red);}
.task-due.td{color:var(--gold);}
.task-edit{padding:4px 8px;border:1px solid var(--border2);border-radius:6px;background:transparent;font-size:12px;color:var(--ink3);cursor:pointer;}

.add-task-row{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--gold-bg);}
.add-task-row input{flex:1;border:1px solid var(--border2);border-radius:8px;padding:8px 10px;font-size:14px;background:#fff;font-family:var(--f);}
.add-task-row input[type=date]{width:130px;flex:none;}
.add-btn{padding:8px 14px;background:var(--gold);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}

/* OVERDUE STRIP */
.ov-strip{background:var(--red-bg);border:1px solid var(--red-bd);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;}
.ov-strip-title{font-size:11px;font-weight:700;color:var(--red);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;}
.ov-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--red-bd);}
.ov-item:last-child{border-bottom:none;}

/* MODAL */
.ov-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;}
.ov-modal.open{display:flex;}
.modal-sheet{background:var(--card);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-height:90vh;overflow-y:auto;}
.modal-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px;}
.modal-title{font-size:17px;font-weight:700;color:var(--ink1);margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border2);border-radius:10px;padding:11px 12px;font-size:15px;background:#fff;font-family:var(--f);color:var(--ink1);}
.field textarea{min-height:80px;resize:vertical;}
.modal-actions{display:flex;gap:10px;margin-top:4px;}
.modal-actions button{flex:1;padding:13px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:none;}
.btn-cancel{background:var(--bg);color:var(--ink2);border:1px solid var(--border2) !important;}
.btn-save{background:var(--gold);color:#fff;}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd) !important;}

/* CAL */
.cal-event{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);}
.cal-event:last-child{border-bottom:none;}
.cal-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:5px;}
.cal-event-title{font-size:14px;color:var(--ink1);font-weight:500;}
.cal-event-time{font-size:11px;color:var(--ink4);margin-top:2px;}
.cal-connect{text-align:center;padding:20px;color:var(--ink4);}
.cal-connect button{margin-top:10px;padding:10px 24px;background:var(--gold);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;display:block;width:100%;}

/* QUICK ACTIONS */
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.quick-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;}
.quick-card:active{background:var(--gold-bg);}
.quick-icon{font-size:22px;}
.quick-label{font-size:13px;font-weight:600;color:var(--ink2);}

/* BADGE */
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:0 4px;}

/* LEADS */
.leads-section{margin-bottom:16px;}
.leads-section-title{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;padding:0 2px;}
.lead-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
.lead-card-hdr{padding:12px 14px;display:flex;align-items:flex-start;gap:10px;}
.lead-avatar{width:38px;height:38px;border-radius:50%;background:var(--gold);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lead-avatar.job{background:#166534;}
.lead-avatar.bb{background:var(--ink4);}
.lead-name{font-size:14px;font-weight:700;color:var(--ink1);line-height:1.3;}
.lead-action{font-size:12px;color:var(--ink3);margin-top:3px;line-height:1.4;}
.lead-meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;}
.lead-detail{font-size:11px;color:var(--ink4);}
.pct-bar{height:4px;background:var(--border);border-radius:2px;flex:1;min-width:60px;}
.pct-fill{height:100%;background:var(--green);border-radius:2px;}
.phase-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-bd);}
.lc-badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;}
.lc-badge.fresh{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd);}
.lc-badge.ok{background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE;}
.lc-badge.stale{background:#FFF7ED;color:#C2410C;border:1px solid #FED7AA;}
.lc-badge.cold{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd);}
.lead-todos{border-top:2px solid var(--border);padding:10px 14px;background:#FAFAF8;}
.lead-todos-label{font-size:10px;font-weight:700;color:var(--ink4);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px;}
.lead-todo-row{display:flex;align-items:center;gap:10px;padding:7px 10px;margin-bottom:4px;background:var(--card);border:1px solid var(--border);border-radius:8px;}
.lead-todo-row:last-child{margin-bottom:0;}
.lead-todo-row .task-chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--border2);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.lead-todo-row .task-chk.done{background:var(--green);border-color:var(--green);}
.lead-todo-row .task-chk.done::after{content:'✓';color:#fff;font-size:12px;font-weight:700;}
.lead-edit-btn{padding:5px 10px;border:1px solid var(--border2);border-radius:6px;font-size:12px;background:transparent;color:var(--ink3);cursor:pointer;flex-shrink:0;}

/* SYNC STATUS */
.sync-bar{display:flex;align-items:center;gap:6px;padding:6px 16px;background:var(--green-bg);border-bottom:1px solid var(--green-bd);font-size:11px;color:var(--green);font-weight:600;}
.sync-bar.err{background:var(--red-bg);border-color:var(--red-bd);color:var(--red);}
.sync-bar.hidden{display:none;}
</style>
</head>
<body>

<!-- SYNC STATUS -->
<div class="sync-bar hidden" id="sync-bar">✓ Synced</div>

<!-- HEADER -->
<div class="header">
  <div class="header-row">
    <div>
      <h1>Kingdom Builders</h1>
      <div class="header-sub" id="hdr-date"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <span class="badge" id="ov-badge" style="display:none;"></span>
      <button onclick="openAddListModal()" style="padding:7px 14px;background:var(--gold);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">+ List</button>
    </div>
  </div>
</div>

<!-- VIEWS -->
<div class="view active" id="view-todos">
  <div id="ov-section"></div>
  <div id="lists-container"></div>
</div>

<div class="view" id="view-calendar">
  <div class="card">
    <div class="card-hdr">
      <span class="card-hdr-title">📅 Today's Calendar</span>
      <div style="display:flex;gap:6px;">
        <button id="cal-add-btn" onclick="openCreateEventModal()" style="display:none;padding:5px 10px;border:1px solid var(--blue-bd);border-radius:6px;background:var(--blue-bg);color:var(--blue);font-size:12px;font-weight:600;cursor:pointer;">+ Event</button>
        <button id="cal-refresh-btn" onclick="fetchCalendarEvents()" style="display:none;padding:5px 10px;border:1px solid var(--border2);border-radius:6px;background:transparent;color:var(--ink3);font-size:12px;cursor:pointer;">↻</button>
      </div>
    </div>
    <div class="card-body" id="cal-body">
      <div class="cal-connect">
        <div>Connect Google Calendar to see today's events</div>
        <button onclick="initCalendar()">Connect Google Calendar</button>
      </div>
    </div>
  </div>
</div>

<div class="view" id="view-leads">
  <div id="leads-active-section"></div>
  <div id="leads-pipeline-section"></div>
  <div id="leads-backburner-section"></div>
</div>

<div class="view" id="view-quick">
  <div class="quick-grid">
    <div class="quick-card" onclick="showView('todos');setTimeout(function(){openAddListModal();},100);">
      <div class="quick-icon">📋</div>
      <div class="quick-label">Add List</div>
    </div>
    <div class="quick-card" onclick="openAddTaskQuick()">
      <div class="quick-icon">✅</div>
      <div class="quick-label">Add Task</div>
    </div>
    <div class="quick-card" onclick="openCreateEventModal()">
      <div class="quick-icon">📅</div>
      <div class="quick-label">Add Calendar Event</div>
    </div>
    <div class="quick-card" onclick="location.reload()">
      <div class="quick-icon">🔄</div>
      <div class="quick-label">Refresh All</div>
    </div>
  </div>
  <div class="card">
    <div class="card-hdr"><span class="card-hdr-title">Sync Status</span></div>
    <div class="card-body" style="font-size:13px;color:var(--ink3);line-height:1.7;">
      <div>📡 Data synced with desktop via Supabase</div>
      <div id="last-sync-time" style="color:var(--ink4);font-size:11px;margin-top:4px;"></div>
    </div>
  </div>
</div>

<!-- NAV -->
<nav class="nav">
  <button class="nav-btn active" id="nav-todos" onclick="showView('todos')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    To-Dos
  </button>
  <button class="nav-btn" id="nav-calendar" onclick="showView('calendar')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Calendar
  </button>
  <button class="nav-btn" id="nav-leads" onclick="showView('leads')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    Leads
  </button>
  <button class="nav-btn" id="nav-quick" onclick="showView('quick')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    Quick Add
  </button>
</nav>

<!-- ADD LIST MODAL -->
<div class="ov-modal" id="list-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="list-modal-title">Add List</div>
    <div class="field"><label>List Name (Client / Job)</label><input id="lm-name" placeholder="e.g. Brooke & Terry Maggard"/></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('list-modal')" style="border:1px solid var(--border2);">Cancel</button>
      <button class="btn-save" onclick="saveList()">Save</button>
    </div>
    <div style="margin-top:10px;" id="list-del-wrap">
      <button class="btn-danger" style="width:100%;padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd);" onclick="deleteList()">Delete List & All Tasks</button>
    </div>
  </div>
</div>

<!-- EDIT TASK MODAL -->
<div class="ov-modal" id="task-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Edit Task</div>
    <div class="field"><label>Task</label><input id="tm-text" placeholder="Task description"/></div>
    <div class="field"><label>Due Date</label><input id="tm-due" type="date"/></div>
    <div class="field"><label>List</label><select id="tm-list"></select></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('task-modal')">Cancel</button>
      <button class="btn-save" onclick="saveTask()">Save</button>
    </div>
    <div style="margin-top:10px;">
      <button class="btn-danger" style="width:100%;padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd);" onclick="deleteTask()">Delete Task</button>
    </div>
  </div>
</div>

<!-- ADD TASK QUICK MODAL -->
<div class="ov-modal" id="add-task-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Add Task</div>
    <div class="field"><label>Task</label><input id="atm-text" placeholder="Task description"/></div>
    <div class="field"><label>Due Date</label><input id="atm-due" type="date"/></div>
    <div class="field"><label>List</label><select id="atm-list"></select></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('add-task-modal')">Cancel</button>
      <button class="btn-save" onclick="saveAddTask()">Add Task</button>
    </div>
  </div>
</div>

<!-- CREATE CAL EVENT MODAL -->
<div class="ov-modal" id="cal-event-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Create Calendar Event</div>
    <div class="field"><label>Title</label><input id="cev-title" placeholder="e.g. Site visit – Maggard"/></div>
    <div class="field"><label>Date</label><input id="cev-date" type="date"/></div>
    <div style="display:flex;gap:10px;">
      <div class="field" style="flex:1;"><label>Start</label><input id="cev-start" type="time" value="09:00"/></div>
      <div class="field" style="flex:1;"><label>End</label><input id="cev-end" type="time" value="10:00"/></div>
    </div>
    <div class="field"><label>Notes (optional)</label><input id="cev-notes" placeholder="Location or description"/></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('cal-event-modal')">Cancel</button>
      <button class="btn-save" onclick="saveCalendarEvent()">Save to Google</button>
    </div>
  </div>
</div>

<script>
// ── REAL DATA SEED (runs once per browser) ──
(function(){
  if(!localStorage.getItem('KB_SEEDED_v2')){

// ── UTILS ──
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function he(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pd(s){if(!s)return null;var p=s.split('-');return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));}
function dd(s){var d=pd(s);if(!d)return null;return Math.round((d-TODAY)/86400000);}
function fd(s){var d=pd(s);if(!d)return '';return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function dueL(s){var n=dd(s);if(n===null)return '';if(n<0)return Math.abs(n)+'d overdue';if(n===0)return 'Due today';if(n===1)return 'Due tomorrow';return 'Due '+fd(s);}
function dueC(s){var n=dd(s);if(n===null)return '';if(n<0)return 'ov';if(n===0)return 'td';return '';}
function sbH(){return{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'};}

// ── CALENDAR ──
function saveCalToken(token,expiresIn){
  var expiry=Date.now()+((expiresIn||3500)*1000);
  localStorage.setItem('kb_cal_token',JSON.stringify({token:token,expiry:expiry}));
}
function loadCalToken(){
  try{
    var saved=localStorage.getItem('kb_cal_token');if(!saved)return null;
    var obj=JSON.parse(saved);
    if(Date.now()<obj.expiry-60000)return obj.token;
    localStorage.removeItem('kb_cal_token');
  }catch(e){}
  return null;
}
function clearCalToken(){localStorage.removeItem('kb_cal_token');}

function tryRestoreCalendar(){
  var saved=loadCalToken();if(!saved)return;
  if(typeof google==='undefined'||!google.accounts){setTimeout(tryRestoreCalendar,800);return;}
  calAccessToken=saved;
  fetchCalendarEvents();
  if(calFetchInterval)clearInterval(calFetchInterval);
  calFetchInterval=setInterval(fetchCalendarEvents,20*60*1000);
  document.getElementById('cal-add-btn').style.display='';
  document.getElementById('cal-refresh-btn').style.display='';
}

function initCalendar(){
  if(typeof google==='undefined'||!google.accounts){setTimeout(initCalendar,800);return;}
  calTokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CAL_CLIENT_ID,
    scope:'https://www.googleapis.com/auth/calendar',
    callback:function(resp){
      if(resp.error)return;
      calAccessToken=resp.access_token;
      saveCalToken(resp.access_token,resp.expires_in);
      document.getElementById('cal-add-btn').style.display='';
      document.getElementById('cal-refresh-btn').style.display='';
      fetchCalendarEvents();
      if(calFetchInterval)clearInterval(calFetchInterval);
      calFetchInterval=setInterval(fetchCalendarEvents,20*60*1000);
    }
  });
  calTokenClient.requestAccessToken();
}

function fetchCalendarEvents(){
  if(!calAccessToken)return;
  var now=new Date();
  var start=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var end=new Date(now.getFullYear(),now.getMonth(),now.getDate()+2);
  fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin='+encodeURIComponent(start.toISOString())+'&timeMax='+encodeURIComponent(end.toISOString())+'&singleEvents=true&orderBy=startTime&maxResults=20',
    {headers:{'Authorization':'Bearer '+calAccessToken}})
    .then(function(r){return r.json();})
    .then(function(data){
      if(data.error){if(data.error.code===401){calAccessToken=null;clearCalToken();}return;}
      var events=(data.items||[]).filter(function(e){return e.status!=='cancelled';});
      renderCalendar(events);
    }).catch(function(){});
}

function renderCalendar(events){
  var body=document.getElementById('cal-body');
  if(!events.length){body.innerHTML='<div style="text-align:center;padding:20px;color:var(--ink4);">No events today or tomorrow</div>';return;}
  body.innerHTML=events.map(function(ev){
    var start=ev.start.dateTime?new Date(ev.start.dateTime):null;
    var time=start?start.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'All day';
    return '<div class="cal-event">'
      +'<div class="cal-dot"></div>'
      +'<div><div class="cal-event-title">'+he(ev.summary||'(No title)')+'</div>'
      +'<div class="cal-event-time">'+time+'</div></div>'
      +'</div>';
  }).join('');
}

function openCreateEventModal(){
  if(!calAccessToken){alert('Connect Google Calendar first.');return;}
  var today=new Date().toISOString().slice(0,10);
  document.getElementById('cev-title').value='';
  document.getElementById('cev-date').value=today;
  document.getElementById('cev-start').value='09:00';
  document.getElementById('cev-end').value='10:00';
  document.getElementById('cev-notes').value='';
  openModal('cal-event-modal');
}
function saveCalendarEvent(){
  var title=document.getElementById('cev-title').value.trim();
  var date=document.getElementById('cev-date').value;
  var start=document.getElementById('cev-start').value;
  var end=document.getElementById('cev-end').value;
  var notes=document.getElementById('cev-notes').value.trim();
  if(!title||!date||!start||!end){alert('Please fill in title, date, and times.');return;}
  var body={summary:title,description:notes||undefined,
    start:{dateTime:date+'T'+start+':00',timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone},
    end:{dateTime:date+'T'+end+':00',timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone}};
  fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events',{
    method:'POST',headers:{'Authorization':'Bearer '+calAccessToken,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  }).then(function(r){return r.json();})
  .then(function(data){
    if(data.error){alert('Error: '+data.error.message);return;}
    closeModal('cal-event-modal');fetchCalendarEvents();
  }).catch(function(){alert('Failed to create event.');});
}

// ── LEADS ──
function ensurePipelineList(){
  if(!lists.find(function(l){return l.id===PIPELINE_LIST_ID;})){
    lists.push({id:PIPELINE_LIST_ID,name:'Leads Pipeline'});
  }
}
function lcDays(s){if(!s)return null;var n=Math.round((TODAY-pd(s))/86400000);return n;}
function lcBadge(s){
  var n=lcDays(s);
  if(n===null)return '<span class="lc-badge cold">Never</span>';
  if(n===0)return '<span class="lc-badge fresh">Today</span>';
  if(n<=3)return '<span class="lc-badge fresh">'+n+'d ago</span>';
  if(n<=7)return '<span class="lc-badge ok">'+n+'d ago</span>';
  if(n<=14)return '<span class="lc-badge stale">'+n+'d ago</span>';
  return '<span class="lc-badge cold">'+n+'d ago</span>';
}
function ini(name){return name.split(/[\s&]+/).filter(Boolean).slice(0,2).map(function(w){return w[0].toUpperCase();}).join('');}

function renderLeads(){
  var jobs=board.filter(function(b){return b.type==='job';}).sort(function(a,b){return(a.ord||0)-(b.ord||0);});
  var leads=board.filter(function(b){return b.type==='lead';}).sort(function(a,b){return(a.ord||0)-(b.ord||0);});
  var bb=board.filter(function(b){return b.type==='backburner';}).sort(function(a,b){return(a.ord||0)-(b.ord||0);});

  function actionTodos(boardId){
    return todos.filter(function(t){return t.boardRef===boardId&&!t.done;});
  }
  function todoRows(boardId){
    var items=actionTodos(boardId);
    if(!items.length) return '';
    return '<div class="lead-todos">'
      +'<div class="lead-todos-label">Action Items</div>'
      +items.map(function(t){
        var chkFn='pipelineCheck("'+t.id+'")';
        return '<div class="lead-todo-row">'
          +'<div class="task-chk'+(t.done?' done':'')+'" onclick="'+chkFn+'"></div>'
          +'<div style="flex:1;min-width:0;">'
          +'<div style="font-size:13px;color:var(--ink1);">'+he(t.text)+'</div>'
          +(t.due?'<div class="task-due '+dueC(t.due)+'">'+dueL(t.due)+'</div>':'')
          +'</div>'
          +'</div>';
      }).join('')
      +'</div>';
  
  }
  function jobCard(j){
    var editFn = 'openLeadEdit("'+j.id+'")';
    return '<div class="lead-card">'
      +'<div class="lead-card-hdr">'
      +'<div class="lead-avatar job">'+he(ini(j.name))+'</div>'
      +'<div style="flex:1;min-width:0;">'
      +'<div class="lead-name">'+he(j.name)+'</div>'
      +(j.action?'<div class="lead-action">'+he(j.action)+'</div>':'')
      +'<div class="lead-meta">'
      +(j.phase?'<span class="phase-tag">'+he(j.phase)+'</span>':'')
      +'<div style="display:flex;align-items:center;gap:5px;flex:1;">'
      +'<div class="pct-bar"><div class="pct-fill" style="width:'+(j.pct||0)+'%"></div></div>'
      +'<span style="font-size:10px;color:var(--ink4);white-space:nowrap;">'+(j.pct||0)+'%</span>'
      +'</div>'
      +lcBadge(j.lastContact)
      +'</div>'
      +(j.addr?'<div class="lead-detail">'+he(j.addr)+'</div>':'')
      +'</div>'
      +'<button class="lead-edit-btn" onclick="'+editFn+'">✎</button>'
      +'</div>'
      +todoRows(j.id)
      +'</div>';
  }
  function leadCard(l,cls){
    var editFn = 'openLeadEdit("'+l.id+'")';
    return '<div class="lead-card">'
      +'<div class="lead-card-hdr">'
      +'<div class="lead-avatar'+(cls?' '+cls:'')+'">'+he(ini(l.name))+'</div>'
      +'<div style="flex:1;min-width:0;">'
      +'<div class="lead-name">'+he(l.name)+'</div>'
      +(l.action?'<div class="lead-action">'+he(l.action)+'</div>':'')
      +'<div class="lead-meta">'
      +(l.lot?'<span class="lead-detail">'+he(l.lot)+'</span>':'')
      +lcBadge(l.lastContact)
      +'</div>'
      +'</div>'
      +'<button class="lead-edit-btn" onclick="'+editFn+'">✎</button>'
      +'</div>'
      +todoRows(l.id)
      +'</div>';
  }

  document.getElementById('leads-active-section').innerHTML=jobs.length
    ?'<div class="leads-section"><div class="leads-section-title">🏗 Active Builds ('+jobs.length+')</div>'+jobs.map(jobCard).join('')+'</div>':'';
  document.getElementById('leads-pipeline-section').innerHTML=leads.length
    ?'<div class="leads-section"><div class="leads-section-title">🔥 Pipeline ('+leads.length+')</div>'+leads.map(function(l){return leadCard(l,'');}).join('')+'</div>':'';
  document.getElementById('leads-backburner-section').innerHTML=bb.length
    ?'<div class="leads-section"><div class="leads-section-title">❄ Backburner ('+bb.length+')</div>'+bb.map(function(l){return leadCard(l,'bb');}).join('')+'</div>':'';
}

// ── PIPELINE TODO CHECK ──
function pipelineCheck(id){
  var t=todos.find(function(x){return x.id===id;});if(!t)return;
  t.done=!t.done;
  save();renderLeads();renderTodos ? renderTodos() : null;renderHeader();
}

// ── LEAD EDIT MODAL ──
function openLeadEdit(id){
  editBoardId=id;
  var b=board.find(function(x){return x.id===id;});if(!b)return;
  document.getElementById('le-name').value=b.name||'';
  document.getElementById('le-action').value=b.action||'';
  document.getElementById('le-action-due').value=b.actionDue||'';
  document.getElementById('le-lc').value=b.lastContact||'';
  if(b.type==='job'){
    document.getElementById('le-job-fields').style.display='';
    document.getElementById('le-lead-fields').style.display='none';
    document.getElementById('le-phase').value=b.phase||'';
    document.getElementById('le-pct').value=b.pct||0;
    document.getElementById('le-addr').value=b.addr||'';
  } else {
    document.getElementById('le-job-fields').style.display='none';
    document.getElementById('le-lead-fields').style.display='';
    document.getElementById('le-lot').value=b.lot||'';
  }
  openModal('lead-edit-modal');
}
function saveLeadEdit(){
  var b=board.find(function(x){return x.id===editBoardId;});if(!b)return;
  b.name=document.getElementById('le-name').value.trim()||b.name;
  b.action=document.getElementById('le-action').value.trim();
  b.actionDue=document.getElementById('le-action-due').value;
  b.lastContact=document.getElementById('le-lc').value;
  if(b.type==='job'){
    b.phase=document.getElementById('le-phase').value;
    b.pct=parseInt(document.getElementById('le-pct').value)||0;
    b.addr=document.getElementById('le-addr').value.trim();
  } else {
    b.lot=document.getElementById('le-lot').value.trim();
  }
  localStorage.setItem('kb5_board',JSON.stringify(board));
  // Sync action item to pipeline todos
  todos=todos.filter(function(t){return t.boardRef!==editBoardId;});
  var actionText=document.getElementById('le-action').value.trim();
  var actionDue=document.getElementById('le-action-due').value;
  if(actionText&&b){
    ensurePipelineList();
    var lt=todos.filter(function(t){return t.listId===PIPELINE_LIST_ID;});
    todos.push({id:uid(),text:actionText+' — '+b.name,listId:PIPELINE_LIST_ID,due:actionDue,done:false,ord:lt.length,boardRef:b.id});
    save();
  } else { save(); }
  renderLeads();renderHeader();closeModal('lead-edit-modal');
}

document.getElementById('hdr-date').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

</script>

    <div class="field"><label>Name</label><input id="le-name" placeholder="Client name"/></div>
    <div class="field"><label>Next Action / Status</label><input id="le-action" placeholder="What needs to happen next"/></div>
    <div class="field"><label>Action Due Date</label><input id="le-action-due" type="date"/></div>
    <div class="field"><label>Last Contact</label><input id="le-lc" type="date"/></div>
    <div id="le-job-fields">
      <div class="field"><label>Phase</label>
        <select id="le-phase">
          <option>Pre-Construction</option><option>Demo</option><option>Framing</option>
          <option>MEP Rough</option><option>Insulation</option><option>Drywall</option>
          <option>Trim</option><option>Closeout</option>
        </select>
      </div>
      <div class="field"><label>% Complete</label><input id="le-pct" type="number" min="0" max="100" placeholder="0"/></div>

    </div>
    <div id="le-lead-fields" style="display:none;">

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('lead-edit-modal')">Cancel</button>
      <button class="btn-save" onclick="saveLeadEdit()">Save</button>
    </div>
  </div>
</div>
